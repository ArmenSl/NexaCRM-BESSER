# Render Blueprint — NexaCRM
# https://render.com/docs/blueprint-spec

services:
  # ─── Backend (FastAPI + SQLite) ────────────────────────────────
  - type: web
    name: nexacrm-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_data.py && uvicorn main_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/Class_Diagram.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false          # manually set in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11"
    disk:
      name: nexacrm-sqlite
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # ─── Frontend (React + Vite → static site) ────────────────────
  - type: web
    name: nexacrm-app
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: VITE_API_URL
        fromService:
          name: nexacrm-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
